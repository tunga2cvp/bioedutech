<!-- Chat Button - Fixed bottom right -->
<div class="chat-button" (click)="isOpen = true" [class.hidden]="isOpen">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2Z" fill="white"/>
  </svg>
</div>

<!-- Chat Window -->
<div class="chat-window" [class.open]="isOpen">
  <div class="chat-header">
    <div class="header-left">
      <div class="avatar">
        <span class="robot-emoji">🤖</span>
      </div>
      <div class="header-info">
        <h3>BioBot - Trợ lý Sinh học</h3>
        <p>Đang hoạt động</p>
      </div>
    </div>
    <button class="close-button" (click)="closeChat()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41Z" fill="white"/>
      </svg>
    </button>
  </div>

  <div class="chat-messages" #chatMessages>
    <div *ngFor="let message of messages" class="message" [class.user]="message.role === 'user'">
      <div class="message-content">
        {{ message.content }}
      </div>
      <div class="message-time">
        {{ message.timestamp | date:'HH:mm' }}
      </div>
    </div>
    
    <!-- Loading indicator -->
    <div *ngIf="isLoading" class="message assistant loading">
      <div class="message-content">
        <div class="typing-indicator">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </div>

  <div class="chat-input-container">
    <input 
      type="text" 
      class="chat-input" 
      [(ngModel)]="currentMessage"
      (keypress)="onKeyPress($event)"
      placeholder="Nhập câu hỏi của bạn..."
      [disabled]="isLoading"
      spellcheck="false"
    />
    <button 
      class="send-button" 
      (click)="sendMessage()"
      [disabled]="!currentMessage.trim() || isLoading"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12L2.01 3L2 10L17 12L2 14L2.01 21Z" fill="currentColor"/>
      </svg>
    </button>
  </div>
</div>
