<div class="exercise-card">
  <div class="exercise-header">
    <div class="exercise-title">
      <h4>{{ exercise.title }}</h4>
      <div class="exercise-meta">
        <span class="meta-badge">
          {{ exercise.totalQuestions || exercise.questions.length }} câu hỏi
        </span>
        <span class="badge" [ngClass]="getStatusBadgeClass()">
          {{ getStatusText() }}
        </span>
      </div>
    </div>
  </div>

  <div class="exercise-footer">
    <button type="button" class="btn btn-secondary" (click)="onViewReport($event)">
      📊 Báo cáo
    </button>
    <button type="button" class="btn btn-primary" (click)="onViewExercise($event)">
      📖 Xem bài thi
    </button>
  </div>
</div>
