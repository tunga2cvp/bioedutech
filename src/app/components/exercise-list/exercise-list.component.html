<!-- Teacher Header -->
<app-teacher-header></app-teacher-header>

<!-- Main Content Section -->
<main class="main-content">
  <div class="container">
    <div class="exercise-list-container">
      <!-- Page Header -->
      <div class="page-header">
        <h1>Quản Lý Bài Tập Trắc Nghiệm</h1>
        <p>Tạo, chỉnh sửa và theo dõi các bài tập của bạn</p>
      </div>

      <!-- Bộ lọc -->
  <div class="filters-section">
    <div class="filters-header">
      <h3>Tìm kiếm bài tập</h3>
      <button class="btn btn-secondary btn-sm" (click)="clearFilters()" *ngIf="searchTerm">
        Xóa tìm kiếm
      </button>
    </div>
    
    <div class="search-container">
      <div class="search-input-wrapper">
        <input 
          type="text" 
          id="search" 
          [(ngModel)]="searchTerm" 
          (input)="onSearchChange()"
          placeholder="Nhập tên bài tập để tìm kiếm..."
          class="search-input"
        >
        <span class="search-icon">🔍</span>
      </div>
    </div>
  </div>

  <!-- Danh sách bài tập -->
  <div class="exercises-section">
    <div class="section-header">
      <h3>Danh sách bài tập ({{ filteredExercises.length }})</h3>
      <div class="view-options">
        <button class="btn btn-secondary btn-sm active">Danh sách</button>
        <button class="btn btn-secondary btn-sm">Thẻ</button>
      </div>
    </div>

    <!-- Loading state -->
    <div *ngIf="isLoading" class="loading-state">
      <div class="spinner"></div>
      <p>Đang tải danh sách bài tập...</p>
    </div>

    <!-- Empty state -->
    <div *ngIf="!isLoading && filteredExercises.length === 0" class="empty-state">
      <div class="empty-icon">📚</div>
      <h3>Chưa có bài tập nào</h3>
      <p>Bắt đầu tạo bài tập đầu tiên của bạn</p>
      <button class="btn btn-primary" (click)="router.navigate(['/create-exercise'])">
        Tạo Bài Tập Đầu Tiên
      </button>
    </div>

    <!-- Exercise list -->
    <div *ngIf="!isLoading && filteredExercises.length > 0" class="exercises-grid">
      <app-exercise-card
        *ngFor="let exercise of filteredExercises"
        [exercise]="exercise"
        (viewExercise)="viewExercise($event)"
        (deleteExercise)="deleteExercise($event)"
      ></app-exercise-card>
    </div>
  </div>
    </div>
  </div>
</main>

<!-- Footer Section -->
<footer class="footer">
  <div class="container">
    <p>© 2025 BioEduTech - Nền tảng học tập AI cùng cô Thảo</p>
  </div>
</footer>
