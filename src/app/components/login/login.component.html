<div class="login-container">
  <div class="login-background">
    <div class="floating-elements">
      <div class="element element-1">🧬</div>
      <div class="element element-2">🔬</div>
      <div class="element element-3">📚</div>
      <div class="element element-4">🎓</div>
    </div>
  </div>
  
  <div class="login-card">
    <div class="login-header">
      <div class="logo-section">
        <img src="assets/logo.jpg" alt="BioEduTech Logo" class="logo-icon">
        <div class="logo-text">
          <h1>Sinh học cùng cô Thảo</h1>
          <p>Nền tảng học tập AI</p>
        </div>
      </div>
    </div>
    
    <div class="login-content">
      <h2 class="welcome-text">Chào mừng trở lại!</h2>
      <p class="subtitle">Đăng nhập để tiếp tục hành trình học tập</p>
      
      <form (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Tên đăng nhập</mat-label>
            <input matInput 
                   [(ngModel)]="username" 
                   name="username" 
                   placeholder="Nhập tên đăng nhập của bạn"
                   required>
            <mat-icon matPrefix>person</mat-icon>
          </mat-form-field>
        </div>

        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Mật khẩu</mat-label>
            <input matInput 
                   type="password" 
                   [(ngModel)]="password" 
                   name="password" 
                   placeholder="Nhập mật khẩu của bạn"
                   required>
            <mat-icon matPrefix>lock</mat-icon>
          </mat-form-field>
        </div>

        <div class="role-selection">
          <mat-label>Chọn vai trò:</mat-label>
          <mat-radio-group [(ngModel)]="userRole" name="userRole" class="radio-group">
            <mat-radio-button value="student" class="radio-button">
              <span class="radio-content">
                <mat-icon>school</mat-icon>
                <span>Học sinh</span>
              </span>
            </mat-radio-button>
            <mat-radio-button value="teacher" class="radio-button">
              <span class="radio-content">
                <mat-icon>person</mat-icon>
                <span>Giáo viên</span>
              </span>
            </mat-radio-button>
          </mat-radio-group>
        </div>

        <button mat-raised-button type="submit" 
                class="login-button full-width" 
                [disabled]="isLoading">
          <mat-icon *ngIf="!isLoading">login</mat-icon>
          <mat-icon *ngIf="isLoading" class="spinning">refresh</mat-icon>
          <span *ngIf="!isLoading">Đăng nhập</span>
          <span *ngIf="isLoading">Đang đăng nhập...</span>
        </button>
      </form>
    </div>
  </div>
</div>
