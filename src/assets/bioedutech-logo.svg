        stroke="#2E7D32" 
        stroke-width="1"/>
  
  <!-- AI text -->
  <text x="44" y="24" font-family="Arial, sans-serif" font-size="4" font-weight="bold" fill="#2E7D32" text-anchor="middle">AI</text>
  
  <!-- Connection nodes -->
  <circle cx="50" cy="20" r="1.5" fill="#2E7D32"/>
  <circle cx="50" cy="24" r="1.5" fill="#2E7D32"/>
  <circle cx="50" cy="28" r="1.5" fill="#2E7D32"/>
  
  <!-- Connection lines -->
  <line x1="48" y1="20" x2="50" y2="20" stroke="#2E7D32" stroke-width="1"/>
  <line x1="48" y1="24" x2="50" y2="24" stroke="#2E7D32" stroke-width="1"/>
  <line x1="48" y1="28" x2="50" y2="28" stroke="#2E7D32" stroke-width="1"/>
  
  <!-- BioEduTech text -->
  <text x="100" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#2E7D32">BioEduTech</text>
</svg>
