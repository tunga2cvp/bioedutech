<svg viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Human head outline -->
  <path d="M20 25 Q20 10 35 10 Q50 10 50 25 Q50 40 35 40 Q20 40 20 25 Z" 
        stroke="#2E7D32" 
        stroke-width="2" 
        fill="none"/>
  
  <!-- Brain -->
  <path d="M25 20 Q25 15 30 15 Q35 15 35 20 Q35 25 30 25 Q25 25 25 20 Z" 
        fill="#A5D6A7" 
        stroke="#2E7D32" 
        stroke-width="1"/>
  
  <!-- Brain folds -->
  <path d="M27 18 Q29 16 31 18" stroke="#2E7D32" stroke-width="0.5" fill="none"/>
  <path d="M27 22 Q29 20 31 22" stroke="#2E7D32" stroke-width="0.5" fill="none"/>
  
  <!-- AI Chip -->
  <rect x="40" y="18" width="8" height="8" 
